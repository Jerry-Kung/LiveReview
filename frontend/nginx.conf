server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 反代必须如实转达「客户端是从哪个地址访问的」：
    # $host 会去掉端口，后端据此校验写请求的同源（Origin 里带着 :12439）就会判成跨站，
    # 表现为登录返回 403「请求来源不被信任」。$http_host 原样保留端口，
    # X-Forwarded-* 供外层还有网关时使用。
    location /health {
        proxy_pass http://backend:12439/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传接口需要收大文件请求体：关闭请求体缓冲、放宽体积与超时，
    # 否则 nginx 会先把 8MB 分片写到临时文件、或对 2GB 级上传提前断开。
    location /api/ {
        proxy_pass http://backend:12439/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        client_max_body_size 32m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
