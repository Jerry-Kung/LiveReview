server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://backend:12439/health;
        proxy_set_header Host $host;
    }

    # 上传接口需要收大文件请求体：关闭请求体缓冲、放宽体积与超时，
    # 否则 nginx 会先把 8MB 分片写到临时文件、或对 2GB 级上传提前断开。
    location /api/ {
        proxy_pass http://backend:12439/api/;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        client_max_body_size 32m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
