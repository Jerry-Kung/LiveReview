services:
  backend:
    build:
      context: ../backend
    # 存储凭据在运行时从宿主机 backend/.env 注入，不打进镜像（.dockerignore 已排除 .env）。
    # 本文件所在目录为解析基准，故路径为 ../backend/.env。
    # 该文件缺失时 compose 直接报错，不会静默以「无凭据」状态启动。
    env_file:
      - ../backend/.env
    # environment 优先级高于 env_file：同名项以本列表为准，容器内取值不随 .env 漂移。
    environment:
      APP_ENV: test
      APP_HOST: 0.0.0.0
      APP_PORT: "12439"
      APP_RELOAD: "false"
      DATABASE_URL: sqlite:////app/data/liverreview.db
      # 上传分片与合并临时文件的落盘位置，与 liverreview-media 卷对应
      MEDIA_ROOT: /app/media
      # 测试环境强制真实存储：缺凭据时明确失败，不静默回落到本地 Mock
      STORAGE_BACKEND: tos
      # 模型配置（V0.2）从 backend/.env 注入，与 TOS 凭据同一处；这里只固定并发，
      # 使测试环境的模型调用节奏不随本地 .env 漂移
      LLM_CONCURRENCY: "1"
    volumes:
      - liverreview-media:/app/media
      - liverreview-data:/app/data
    expose:
      - "12439"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:12439/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "12439:80"

volumes:
  liverreview-media:
  liverreview-data:
